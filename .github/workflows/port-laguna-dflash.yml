name: Laguna DFlash compatibility

on:
  pull_request:
    branches:
      - master
    paths:
      - src/llama-arch.h
      - src/llama-arch.cpp
      - src/models/models.h
      - src/models/dflash.cpp
      - tools/apply_laguna_dflash_compat.py
      - tools/port_laguna_dflash_compat.sh
      - .github/workflows/port-laguna-dflash.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure CPU compile check
        run: |
          cmake -S . -B build-port-check \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_HIP=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile llama-cli
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          if ! cmake --build build-port-check --target llama-cli -j2 > compile.log 2>&1; then
            grep -E -B3 -A8 '(^|: )(fatal error|error):|FAILED:|undefined reference' compile.log || tail -n 160 compile.log
            exit 1
          fi
          tail -n 40 compile.log

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laguna-dflash-compile-log
          path: compile.log

      - name: Fail on compile error
        if: steps.compile.outcome == 'failure'
        run: exit 1
